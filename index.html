<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TB Cat Shop - บริการเสกของ The Battle Cats</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:ital,wght@0,400;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mali: ['Mali', 'cursive', 'sans-serif'],
              fredoka: ['Fredoka', 'sans-serif'],
            },
            colors: {
              storeBg: '#F3F4F6',
              storeHeader: '#10B981',
              storeDark: '#1F2937',
              catYellow: '#FFDC61',
              catGolden: '#F59E0B',
              catBrown: '#5C3A21',
            },
            boxShadow: {
              'store': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            }
          }
        }
      }
    </script>

    <style>
      body {
        font-family: 'Mali', cursive, sans-serif;
        background-color: #F8FAFC;
        color: #1F2937;
        min-height: 100vh;
      }
    </style>
</head>
<body class="pb-20">

    <!-- ================= TOP HEADER BAR ================= -->
    <header class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchView('home')">
                <img src="1000045932.webp" alt="TB Cat Shop" onerror="this.src='https://cdn-icons-png.flaticon.com/512/616/616430.png'" class="w-10 h-10 rounded-xl object-cover border-2 border-white shadow">
                <div>
                    <h1 class="font-bold text-base font-fredoka leading-tight">TB Cat Shop</h1>
                    <p class="text-[10px] opacity-90">บริการเสกของ The Battle Cats</p>
                </div>
            </div>

            <!-- Hamburger Menu Button -->
            <button onclick="toggleSidebar()" class="w-10 h-10 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center text-white text-lg transition">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- ================= SIDEBAR MENU ================= -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"></div>
    <div id="sidebarMenu" class="fixed top-0 right-0 bottom-0 w-72 bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="bg-teal-600 text-white p-4 flex justify-between items-center">
            <div class="font-bold font-fredoka text-base flex items-center">
                <i class="fa-solid fa-store mr-2"></i> เมนูร้านค้า
            </div>
            <button onclick="toggleSidebar()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-4 flex-grow overflow-y-auto space-y-2 text-sm font-bold">
            <button onclick="switchView('home'); toggleSidebar();" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-teal-50 text-gray-700 transition">
                <i class="fa-solid fa-house text-teal-600 w-6"></i> <span>หน้าหลัก</span>
            </button>
            <button onclick="switchView('shop'); toggleSidebar();" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-teal-50 text-gray-700 transition">
                <i class="fa-solid fa-bag-shopping text-teal-600 w-6"></i> <span>รายการสินค้า</span>
            </button>
            <button onclick="switchView('topup'); toggleSidebar();" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-teal-50 text-gray-700 transition">
                <i class="fa-solid fa-wallet text-teal-600 w-6"></i> <span>เติมเงิน / แจ้งสลิป</span>
            </button>
            <button onclick="switchView('gacha'); toggleSidebar();" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-teal-50 text-gray-700 transition">
                <i class="fa-solid fa-dice text-teal-600 w-6"></i> <span>เกมสุ่มของแถม</span>
            </button>
            <button onclick="switchView('history'); toggleSidebar();" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-teal-50 text-gray-700 transition">
                <i class="fa-solid fa-clock-rotate-left text-teal-600 w-6
